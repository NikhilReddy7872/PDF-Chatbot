<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Chatbot with Gemini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- We'll use Mozilla's PDF.js to read the PDF file directly in the browser -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .message-bubble {
            max-width: 80%;
            word-wrap: break-word;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .disabled-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 500;
            color: #475569;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
    <div class="bg-white w-full max-w-2xl h-[90vh] rounded-2xl shadow-2xl flex flex-col p-4 sm:p-6 m-4">
        <header class="text-center border-b pb-4">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">PDF Chatbot</h1>
            <p class="text-sm text-slate-500 mt-1">Upload a PDF and ask questions about its content.</p>
        </header>

        <!-- API Key Section -->
        <div id="api-key-section" class="my-6">
            <label for="api-key-input" class="block text-sm font-medium text-slate-700 mb-1">Enter your Gemini API Key</label>
            <div class="flex items-center gap-2">
                <input type="password" id="api-key-input" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Paste your API key here">
                <button id="save-key-button" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition-colors">Save</button>
            </div>
             <p id="api-key-error" class="text-xs text-red-600 mt-1 h-3"></p>
             <p class="text-xs text-slate-500">Your key is stored in session storage and is never sent anywhere except to the Google API.</p>
        </div>

        <!-- PDF Upload Section -->
        <div id="upload-container" class="relative">
             <div id="upload-overlay" class="disabled-overlay">
                <p>Please enter your API key above to begin.</p>
            </div>
            <div id="upload-section" class="flex flex-col items-center justify-center text-center p-8 border-2 border-dashed rounded-lg transition-all opacity-50">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <label for="pdf-upload" class="mt-4 cursor-pointer bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg hover:bg-blue-600 transition-colors">
                    Select PDF
                </label>
                <input type="file" id="pdf-upload" accept=".pdf" class="hidden" disabled>
                <p id="upload-status" class="mt-3 text-sm text-slate-500">No file selected.</p>
            </div>
        </div>

        <!-- Chat Section -->
        <div id="chat-section" class="hidden flex-1 flex-col mt-6">
            <div id="chat-history" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 rounded-lg my-4">
                <!-- Messages will be appended here -->
            </div>
            <div class="relative mt-auto">
                <input type="text" id="user-input" class="w-full pl-4 pr-12 py-3 border rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ask a question..." disabled>
                <button id="send-button" class="absolute right-2 top-1/2 -translate-y-1/2 bg-blue-500 text-white rounded-full p-2.5 hover:bg-blue-600 transition disabled:bg-slate-400 disabled:cursor-not-allowed" disabled>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

<script>
    // --- DOM Element References ---
    const apiKeySection = document.getElementById('api-key-section');
    const apiKeyInput = document.getElementById('api-key-input');
    const saveKeyButton = document.getElementById('save-key-button');
    const apiKeyError = document.getElementById('api-key-error');
    const uploadOverlay = document.getElementById('upload-overlay');
    const uploadSection = document.getElementById('upload-section');
    const pdfUpload = document.getElementById('pdf-upload');
    const uploadStatus = document.getElementById('upload-status');
    const chatSection = document.getElementById('chat-section');
    const chatHistory = document.getElementById('chat-history');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');

    // --- State Management ---
    let pdfTextContent = '';
    let isProcessing = false;
    let geminiApiKey = '';

    // --- Event Listeners ---
    saveKeyButton.addEventListener('click', saveApiKey);
    pdfUpload.addEventListener('change', handleFileSelect, false);
    sendButton.addEventListener('click', handleSendMessage);
    userInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            handleSendMessage();
        }
    });
    
    // --- Initial Setup ---
    window.addEventListener('load', () => {
        const storedKey = sessionStorage.getItem('geminiApiKey');
        if (storedKey) {
            apiKeyInput.value = storedKey;
            saveApiKey();
        }
    });
    
    // Set the workerSrc for PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    /**
     * Saves the API key and enables the application.
     */
    function saveApiKey() {
        const key = apiKeyInput.value.trim();
        if (key) {
            geminiApiKey = key;
            sessionStorage.setItem('geminiApiKey', key);
            apiKeySection.style.display = 'none'; // Hide the section
            uploadOverlay.style.display = 'none'; // Hide the overlay
            uploadSection.classList.remove('opacity-50');
            pdfUpload.disabled = false;
            apiKeyError.textContent = ''; // Clear any previous error messages
        } else {
            // DEBUG: Replaced alert with a non-blocking error message.
            apiKeyError.textContent = 'Please enter a valid API key.';
        }
    }

    /**
     * Handles the PDF file selection and processing.
     * @param {Event} event - The file input change event.
     */
    async function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file || file.type !== 'application/pdf') {
            uploadStatus.textContent = 'Please select a valid PDF file.';
            return;
        }

        uploadStatus.textContent = `Processing "${file.name}"...`;
        pdfTextContent = '';

        try {
            const fileReader = new FileReader();
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;

                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    pdfTextContent += pageText + '\n\n';
                }
                
                uploadStatus.textContent = `"${file.name}" is ready!`;
                uploadSection.classList.add('border-green-500');
                uploadSection.classList.remove('border-dashed');
                
                // Transition to chat view
                setTimeout(() => {
                    document.getElementById('upload-container').style.display = 'none';
                    chatSection.classList.remove('hidden');
                    chatSection.classList.add('flex');
                    userInput.disabled = false;
                    sendButton.disabled = false;
                    appendMessage("Hello! I've read the PDF. How can I help you?", 'bot');
                }, 1000);
            };
            fileReader.readAsArrayBuffer(file);
        } catch (error) {
            console.error('Error processing PDF:', error);
            uploadStatus.textContent = 'Failed to process PDF. Please try another file.';
            appendMessage('There was an error reading the PDF. Please try reloading and uploading again.', 'bot', true);
        }
    }

    /**
     * Handles sending the user's message to the Gemini API.
     */
    function handleSendMessage() {
        const question = userInput.value.trim();
        if (!question || isProcessing) {
            return;
        }

        appendMessage(question, 'user');
        userInput.value = '';
        setProcessingState(true);
        callGeminiAPI(question);
    }
    
    /**
     * Calls the Gemini API with the provided question and PDF context.
     * @param {string} question - The user's question.
     */
    async function callGeminiAPI(question) {
        if (!geminiApiKey) {
            appendMessage('API Key is missing. Please refresh and enter your API key.', 'bot', true);
            setProcessingState(false);
            return;
        }
    
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${geminiApiKey}`;

        const systemPrompt = "You are a helpful assistant designed to answer questions about a provided document.\n- Your primary goal is to find the answer within the document's text. If you find a direct answer, use it.\n- If the user's question is related to the document's content but not explicitly answered, you can use your broader knowledge to provide a helpful, context-aware response. It's good practice to mention when your answer extends beyond the provided text.\n- If the question is completely unrelated to the document, politely state that you can't answer based on the provided context.";

        const userPrompt = `
            DOCUMENT TEXT:
            ---
            ${pdfTextContent}
            ---
            QUESTION:
            ${question}
        `;

        const payload = {
            contents: [{ parts: [{ text: userPrompt }] }],
            systemInstruction: {
                parts: [{ text: systemPrompt }]
            },
        };

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                let errorData = { message: `API Error: ${response.status} ${response.statusText}` };
                try {
                    const responseBody = await response.json();
                    if (responseBody.error && responseBody.error.message) {
                        errorData.message = responseBody.error.message;
                    }
                } catch (jsonError) {
                    console.error("Could not parse error response JSON:", jsonError);
                }
                throw new Error(errorData.message);
            }

            const result = await response.json();
            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
            
            if (text) {
                appendMessage(text, 'bot');
            } else {
                const responseError = result.error || { message: "I'm sorry, I couldn't generate a valid response. The response was empty." };
                appendMessage(responseError.message, 'bot', true);
                console.error("Gemini API Error:", responseError);
            }

        } catch (error) {
            console.error("Error calling Gemini API:", error);
            appendMessage(`An error occurred: ${error.message}. Please check the console for more details.`, 'bot', true);
        } finally {
            setProcessingState(false);
        }
    }


    /**
     * Appends a message to the chat history.
     * @param {string} text - The message text.
     * @param {('user'|'bot')} sender - The sender of the message.
     * @param {boolean} [isError=false] - If the message is an error message.
     */
    function appendMessage(text, sender, isError = false) {
        const messageWrapper = document.createElement('div');
        messageWrapper.classList.add('flex', 'items-start', 'gap-3', sender === 'user' ? 'justify-end' : 'justify-start');

        const messageBubble = document.createElement('div');
        messageBubble.classList.add('p-3', 'rounded-xl', 'message-bubble');

        if (sender === 'user') {
            messageBubble.classList.add('bg-blue-500', 'text-white');
        } else {
            messageBubble.classList.add(isError ? 'bg-red-100' : 'bg-slate-200', 'text-slate-800');
        }

        if (text === 'loading') {
            const loader = document.createElement('div');
            loader.classList.add('loader');
            messageBubble.appendChild(loader);
            messageBubble.id = 'loading-indicator';
        } else {
            // DEBUG: Sanitize the text before inserting it as HTML.
            // This prevents the model from injecting HTML that could break the page layout.
            const tempDiv = document.createElement('div');
            tempDiv.textContent = text;
            messageBubble.innerHTML = tempDiv.innerHTML.replace(/\n/g, '<br>');
        }
        
        messageWrapper.appendChild(messageBubble);
        chatHistory.appendChild(messageWrapper);
        chatHistory.scrollTop = chatHistory.scrollHeight; // Auto-scroll to bottom
    }

    /**
     * Sets the UI state to processing or not processing.
     * @param {boolean} state - True if processing, false otherwise.
     */
    function setProcessingState(state) {
        isProcessing = state;
        userInput.disabled = state;
        sendButton.disabled = state;

        const loadingIndicator = document.getElementById('loading-indicator');
        if (state) {
            if (!loadingIndicator) {
                 appendMessage('loading', 'bot');
            }
        } else {
            if (loadingIndicator) {
                loadingIndicator.parentElement.remove();
            }
        }
    }
</script>
</body>
</html>
